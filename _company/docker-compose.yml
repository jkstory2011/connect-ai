version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

  airflow-init:
    image: apache/airflow:2.9.0
    command: ["bash", "-c", "airflow db init"]
    depends_on:
      - postgres

  airflow-scheduler:
    image: apache/airflow:2.9.0
    command: ["bash", "-c", "airflow scheduler"]
    depends_on:
      - airflow-init
    volumes:
      - ./src/dags:/opt/airflow/dags

  airflow-webserver:
    image: apache/airflow:2.9.0
    command: ["bash", "-c", "airflow webserver"]
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    volumes:
      - ./src/dags:/opt/airflow/dags

  thumbnail-worker:
    build:
      context: ./docker
      dockerfile: thumbnail_worker.Dockerfile
    volumes:
      - ./src/tasks:/app/tasks